name: Go Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            name: linux
            cpu: amd64

          - os: ubuntu-24.04-arm
            name: linux
            cpu: arm64

          - os: macos-latest
            name: darwin
            cpu: arm64

          - os: windows-latest
            name: windows
            cpu: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch libstorage
        env:
          OS: ${{ matrix.target.name }}
          ARCH: ${{ matrix.target.cpu }}
        run: make fetch

      # Windows has no rpath: the DLL is found through the PATH
      - name: Add libs to PATH (Windows)
        if: matrix.target.name == 'windows'
        shell: bash
        run: echo "${{ github.workspace }}\libs" >> "$GITHUB_PATH"

      - name: Build Logos Storage go
        run: make

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Go test
        run: make test
