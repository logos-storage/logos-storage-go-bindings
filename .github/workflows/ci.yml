name: Go Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read libstorage version
        id: libstorage
        run: echo "version=$(sed -n 's/^VERSION[[:space:]]*:=[[:space:]]*//p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Cache libstorage
        id: cache-libstorage
        uses: actions/cache@v4
        with:
          path: libs
          key: libstorage-${{ runner.os }}-${{ runner.arch }}-${{ steps.libstorage.outputs.version }}

      - name: Fetch libstorage
        if: steps.cache-libstorage.outputs.cache-hit != 'true'
        run: make fetch

      # Windows has no rpath: the DLL is found through the PATH
      - name: Add libs to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "${{ github.workspace }}\libs" >> "$GITHUB_PATH"

      - name: Build Logos Storage go
        run: make

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Go test
        run: make test
